# kube-prometheus-stack Helm values
# Usage: helm install monitoring prometheus-community/kube-prometheus-stack -n monitoring -f monitoring/prometheus-values.yaml

prometheus:
  prometheusSpec:
    # ServiceMonitor selector: todo-app Namespaceのものも収集
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    # リソース制限(minikube向け)
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # データ保持期間
    retension: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
grafana:
  adminPassword: admin
  # ダッシュボードプロビジョニング
  dashboardProviders:
    dashboardProviders.yaml:
      apiVersion: 1
      providers:
        - name: custom
          orgId: 1
          folder: "Todo App"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/custom
    dashboardsConfigMaps:
      custom: todo-app-dashboard
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
