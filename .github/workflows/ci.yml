name: CI

on:
    workflow_dispatch:
    push:
      branches: [ "main" ]
      paths:
        - "app/**"
    pull_request:
      branches: [main]
      paths:
        - "app/**"

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com
  API_IMAGE: todo-api
  FRONTEND_IMAGE: todo-frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/api/go.mod
      - name: Run on vet
        working-directory: app/api
        run: go vet ./...
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/api/go.mod
      - name: Run tests
        working-directory: app/api
        run: go test ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eks-role
          aws-region: ${{env.AWS_REGION}}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      # API Image
      - uses: docker/build-push-action@v5
        with:
          context: app/api
          push: true
          tags: |
            ${{env.ECR_REGISTRY}}/${{env.API_IMAGE}}:${{github.sha}}
            ${{env.ECR_REGISTRY}}/${{env.API_IMAGE}}:latest
          cache-from: type=gha
          cache-to: type=gha, mode=max

      # Front Image
      - uses: docker/build-push-action@v5
        with:
          context: app/frontend
          push: true
          tags: |
            ${{env.ECR_REGISTRY}}/${{env.FRONTEND_IMAGE}}:${{github.sha}}
            ${{env.ECR_REGISTRY}}/${{env.FRONTEND_IMAGE}}:latest
          cache-from: type=gha
          cache-to: type=gha, mode=max
